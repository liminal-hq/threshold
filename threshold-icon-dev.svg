<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="128" height="128">
  <defs>
    <clipPath id="iconClip">
      <rect width="24" height="24" rx="5"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <rect width="24" height="24" rx="5" fill="#1e293b"/>

  <!-- Large clock circle -->
  <circle cx="12" cy="12" r="9" fill="#334155"/>

  <!-- Threshold range arc (6:00 to 8:00, thinner than V5) -->
  <path d="M 12 21 A 9 9 0 0 1 4.21 16.5"
        fill="none"
        stroke="#fbbf24"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.6"/>

  <!-- 12 o'clock marker -->
  <rect x="11.2" y="4" width="1.6" height="2.5" rx="0.5" fill="#64748b"/>

  <!-- Hour hand - pointing straight up to 12 -->
  <line x1="12" y1="12" x2="12" y2="6.5"
        stroke="#e2e8f0"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Ghost minute hand 1 - at 6:30 -->
  <line x1="12" y1="12" x2="9.67" y2="20.69"
        stroke="#fbbf24"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.3"/>

  <!-- Ghost minute hand 2 - at 7:30 -->
  <line x1="12" y1="12" x2="5.64" y2="18.36"
        stroke="#fbbf24"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.3"/>

  <!-- Solid minute hand - at 7:00 (the current/actual time) -->
  <line x1="12" y1="12" x2="7.5" y2="19.79"
        stroke="#fbbf24"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="12" cy="12" r="1.5" fill="#fbbf24"/>

  <!-- Small dots at arc endpoints (6:00 and 8:00) -->
  <circle cx="12" cy="21" r="0.9" fill="#fbbf24" opacity="0.4"/>
  <circle cx="4.21" cy="16.5" r="0.9" fill="#fbbf24" opacity="0.4"/>

  <!-- "Dev" ribbon banner, clipped to the icon's rounded-square silhouette. The lettering is
       drawn as plain filled paths/rects rather than an SVG <text> element; <text> needs a
       system font to be resolvable wherever this gets rasterized (confirmed: it silently
       renders as nothing at all inside the tauri-dev-mobile container used for real dev
       builds, even though it renders fine locally), while path/rect geometry always renders
       identically everywhere. D is drawn as four wall segments (not a filled blob) so it has
       a genuine open counter instead of reading as a solid shape; e/v sit at x-height on the
       same baseline as D's cap-height. -->
  <g clip-path="url(#iconClip)">
    <g transform="translate(18.5 18.5) rotate(-45)">
      <rect x="-9" y="-2.1" width="18" height="4.2" fill="#ef4444"/>
      <g transform="translate(-2.34 -1.5) scale(0.6)" fill="#ffffff">
        <!-- D (cap height, y 0-5) -->
        <rect x="0" y="0" width="0.9" height="5"/>
        <rect x="0" y="0" width="2.4" height="0.9"/>
        <rect x="0" y="4.1" width="2.4" height="0.9"/>
        <rect x="1.75" y="0.9" width="0.65" height="3.2"/>
        <!-- e (x-height, y 2-5) -->
        <g transform="translate(2.9 0)">
          <rect x="0" y="2" width="2.2" height="0.7"/>
          <rect x="0" y="2" width="0.7" height="3"/>
          <rect x="1.5" y="2" width="0.7" height="1.25"/>
          <rect x="0" y="3.15" width="2.2" height="0.7"/>
          <rect x="0" y="4.3" width="1.4" height="0.7"/>
        </g>
        <!-- v (x-height, y 2-5) -->
        <path d="M5.6,2 L6.7,5 L7.8,2 L7.25,2 L6.7,3.75 L6.15,2 Z"/>
      </g>
    </g>
  </g>
</svg>
