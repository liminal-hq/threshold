<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark background - full bleed, no rounded corners -->
  <rect width="512" height="512" fill="#1e293b"/>

  <!-- Large clock circle - scaled to fit within safe zone with generous padding -->
  <circle cx="256" cy="256" r="140" fill="#334155"/>

  <!-- Threshold range arc (6:00 to 8:00) -->
  <path d="M 256 396 A 140 140 0 0 1 131.15 326.85"
        fill="none"
        stroke="#fbbf24"
        stroke-width="39"
        stroke-linecap="round"
        opacity="0.6"/>

  <!-- 12 o'clock marker -->
  <rect x="242.53" y="121.78" width="24.94" height="38.89" rx="7.78" fill="#64748b"/>

  <!-- Hour hand - pointing straight up to 12 -->
  <line x1="256" y1="256" x2="256" y2="167.78"
        stroke="#e2e8f0"
        stroke-width="38.89"
        stroke-linecap="round"/>

  <!-- Ghost minute hand 1 - at 6:30 -->
  <line x1="256" y1="256" x2="221.08" y2="391.47"
        stroke="#fbbf24"
        stroke-width="31.11"
        stroke-linecap="round"
        opacity="0.3"/>

  <!-- Ghost minute hand 2 - at 7:30 -->
  <line x1="256" y1="256" x2="157.08" y2="354.92"
        stroke="#fbbf24"
        stroke-width="31.11"
        stroke-linecap="round"
        opacity="0.3"/>

  <!-- Solid minute hand - at 7:00 (the current/actual time) -->
  <line x1="256" y1="256" x2="186.92" y2="381.56"
        stroke="#fbbf24"
        stroke-width="34.22"
        stroke-linecap="round"/>

  <!-- Centre dot -->
  <circle cx="256" cy="256" r="23.33" fill="#fbbf24"/>

  <!-- Small dots at arc endpoints (6:00 and 8:00) -->
  <circle cx="256" cy="396" r="14" fill="#fbbf24" opacity="0.4"/>
  <circle cx="131.15" cy="326.85" r="14" fill="#fbbf24" opacity="0.4"/>

  <!-- "Dev" ribbon banner, kept within the adaptive-icon safe-zone radius (~186px from
       centre, inside the ~61%-diameter circle every launcher mask shape preserves) so it
       survives cropping on real devices instead of being masked away at the corner. The
       lettering is drawn as plain filled paths/rects rather than an SVG <text> element;
       <text> needs a system font to be resolvable wherever this gets rasterized (confirmed:
       it silently renders as nothing at all inside the tauri-dev-mobile container used for
       real dev builds, even though it renders fine locally), while path/rect geometry always
       renders identically everywhere. D is drawn as four wall segments (not a filled blob)
       so it has a genuine open counter instead of reading as a solid shape; e/v sit at
       x-height on the same baseline as D's cap-height. -->
  <g transform="translate(355 355) rotate(-45)">
    <rect x="-45" y="-17" width="90" height="34" fill="#ef4444"/>
    <g transform="translate(-15.6 -10) scale(4)" fill="#ffffff">
      <!-- D (cap height, y 0-5) -->
      <rect x="0" y="0" width="0.9" height="5"/>
      <rect x="0" y="0" width="2.4" height="0.9"/>
      <rect x="0" y="4.1" width="2.4" height="0.9"/>
      <rect x="1.75" y="0.9" width="0.65" height="3.2"/>
      <!-- e (x-height, y 2-5) -->
      <g transform="translate(2.9 0)">
        <rect x="0" y="2" width="2.2" height="0.7"/>
        <rect x="0" y="2" width="0.7" height="3"/>
        <rect x="1.5" y="2" width="0.7" height="1.25"/>
        <rect x="0" y="3.15" width="2.2" height="0.7"/>
        <rect x="0" y="4.3" width="1.4" height="0.7"/>
      </g>
      <!-- v (x-height, y 2-5) -->
      <path d="M5.6,2 L6.7,5 L7.8,2 L7.25,2 L6.7,3.75 L6.15,2 Z"/>
    </g>
  </g>
</svg>
