[package]
name = "tauri-plugin-native-log"
version = "0.1.0"
authors = ["Threshold"]
edition = "2021"
links = "tauri-plugin-native-log"
description = "Shared substrate carrying the Android NativeEventLog Kotlin source for Threshold's native plugins"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }

[build-dependencies]
tauri-plugin = { version = "2.0.0", features = ["build"] }
