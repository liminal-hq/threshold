[package]
name = "tauri-plugin-predictive-back"
version = "0.1.0"
authors = ["Threshold"]
edition = "2021"
links = "tauri-plugin-predictive-back"
description = "Android predictive back gesture support for Threshold"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2.0.0", features = ["build"] }
