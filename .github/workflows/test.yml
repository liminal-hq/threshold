name: Test

on:
  pull_request:
  # Also run on push to main solely to warm test-rust/test-kotlin-*'s caches under main's own
  # branch scope -- GitHub Actions caches only fall back current branch -> base branch -> default
  # branch, and with no push-to-main trigger at all, no cache ever existed at that fallback tier.
  # Every brand-new PR branch's first run was a guaranteed full cold compile forever, not just
  # until some cache warmed up. The lint/typecheck jobs below stay pull_request-only via their
  # own `if:` since they don't populate any cache and add nothing by re-running on merge.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

jobs:
  test-js:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Build vendored notification plugin package
        run: |
          pnpm --dir vendor/tauri-plugins-workspace/plugins/notification install
          pnpm --dir vendor/tauri-plugins-workspace/plugins/notification build

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check JS/TS
        run: |
          pnpm -r run typecheck

      - name: Run JS/TS Tests
        run: |
          pnpm -r run test:ci

      - name: Debug JS Test Results
        run: find . -name "junit.xml"

      - name: Upload JS Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: js-test-results
          path: '**/junit.xml'

      - name: Publish JS/TS Test Results
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Threshold JS/TS Tests
          files: '**/junit.xml'

      - name: Lint Code
        run: pnpm format:check

  lint-mermaid:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Mermaid diagrams
        run: pnpm run lint:mermaid

  check-license-headers:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check licence headers
        run: bash scripts/check-headers.sh

  test-rust:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-bad \
            fonts-noto-color-emoji \
            pkg-config \
            unzip \
            xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: swatinem/rust-cache@v2.8.2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run Rust Tests
        run: |
          cargo nextest run --workspace --config-file nextest.toml --profile ci

      - name: Upload Rust Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-test-results
          path: target/nextest/ci/junit.xml

      - name: Publish Rust Test Results
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Threshold Rust Tests
          files: target/nextest/ci/junit.xml

      - name: Rust Format Check
        run: cargo fmt --all -- --check

      - name: Rust Clippy
        run: cargo clippy --all-features -- -D warnings

  test-kotlin-wear:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      packages: read
      checks: write
      pull-requests: write
    container:
      image: ghcr.io/liminal-hq/tauri-ci-mobile:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.gradle/caches
            /github/home/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wear-${{ hashFiles('apps/threshold-wear/**/*.gradle*', 'apps/threshold-wear/**/gradle-wrapper.properties', 'apps/threshold-wear/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wear-

      - name: Run Wear app unit tests
        working-directory: apps/threshold-wear
        run: ./gradlew testDebugUnitTest

      - name: Upload Kotlin Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-wear-test-results
          path: apps/threshold-wear/build/test-results/**/*.xml

      - name: Publish Wear Test Results
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Threshold Wear Tests
          files: apps/threshold-wear/build/test-results/**/*.xml

  test-kotlin-plugins:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      packages: read
      checks: write
      pull-requests: write
    container:
      image: ghcr.io/liminal-hq/tauri-ci-mobile:latest
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.gradle/caches
            /github/home/.gradle/wrapper
          key: ${{ runner.os }}-gradle-plugins-${{ hashFiles('plugins/**/android/**/*.gradle*', 'plugins/**/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-plugins-

      - name: Run core plugin Android unit tests
        run: |
          TAURI_VERSION="$(awk '
            BEGIN { in_tauri = 0 }
            /^\[\[package\]\]$/ { in_tauri = 0; next }
            /^name = "tauri"$/ { in_tauri = 1; next }
            in_tauri == 1 && /^version = "/ {
              match($0, /"([^"]+)"/);
              print substr($0, RSTART + 1, RLENGTH - 2);
              exit
            }
          ' Cargo.lock)"
          if [ -z "${TAURI_VERSION}" ]; then
            echo "Failed to determine tauri version from Cargo.lock"
            exit 1
          fi

          mkdir -p .ci
          curl -LsSf -A "liminal-hq/threshold CI (https://github.com/liminal-hq/threshold)" "https://crates.io/api/v1/crates/tauri/${TAURI_VERSION}/download" | tar -xz -C .ci
          TAURI_ANDROID_PATH="$(pwd)/.ci/tauri-${TAURI_VERSION}/mobile/android"
          if [ ! -f "${TAURI_ANDROID_PATH}/build.gradle.kts" ]; then
            echo "tauri-android source not found at ${TAURI_ANDROID_PATH}"
            exit 1
          fi

          write_kts_settings() {
            local plugin_dir="$1"
            local extra_includes="${2:-}"
            cat > "${plugin_dir}/settings.gradle.kts" <<EOF
          pluginManagement {
            repositories {
              mavenCentral()
              gradlePluginPortal()
              google()
            }
            resolutionStrategy {
              eachPlugin {
                when (requested.id.id) {
                  "com.android.library" -> useVersion("8.11.0")
                  "org.jetbrains.kotlin.android" -> useVersion("1.9.25")
                }
              }
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              mavenCentral()
              google()
            }
          }

          include(":tauri-android")
          project(":tauri-android").projectDir = file("${TAURI_ANDROID_PATH}")
          ${extra_includes}
          EOF
          }

          write_groovy_settings() {
            local plugin_dir="$1"
            cat > "${plugin_dir}/settings.gradle" <<EOF
          pluginManagement {
              repositories {
                  mavenCentral()
                  gradlePluginPortal()
                  google()
              }
              resolutionStrategy {
                  eachPlugin {
                      switch (requested.id.id) {
                          case "com.android.library":
                              useVersion("8.11.0")
                              break
                          case "org.jetbrains.kotlin.android":
                              useVersion("1.9.25")
                              break
                      }
                  }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  mavenCentral()
                  google()
              }
          }

          include ':tauri-android'
          project(':tauri-android').projectDir = new File('${TAURI_ANDROID_PATH}')
          EOF
          }

          # alarm-manager (Phase 2A) and wear-sync (Phase 2B) of issue #255 both now have a
          # real `implementation(project(":tauri-plugin-native-bus"))` dependency, so both
          # isolated settings builds need the matching project include below or their builds
          # would fail to resolve that reference. Gradle's unqualified `testDebugUnitTest`
          # selector runs a task in every project in the build graph that has it, so once
          # more than one plugin's settings includes native-bus, every gradlew invocation
          # below uses a qualified `:testDebugUnitTest` task path (leading colon) instead --
          # that runs only the root project's own task (i.e. only whichever plugin `-p`
          # points at), so native-bus's tests never run redundantly and a native-bus failure
          # is never misattributed to another plugin's step.
          NATIVE_BUS_ANDROID_PATH="$(pwd)/plugins/native-bus/android"
          NATIVE_BUS_INCLUDE="include(\":tauri-plugin-native-bus\")
          project(\":tauri-plugin-native-bus\").projectDir = file(\"${NATIVE_BUS_ANDROID_PATH}\")"

          write_kts_settings "plugins/alarm-manager/android" "${NATIVE_BUS_INCLUDE}"
          write_kts_settings "plugins/theme-utils/android"
          write_kts_settings "plugins/os-prefs/android"
          write_kts_settings "plugins/predictive-back/android"
          write_kts_settings "plugins/wear-sync/android" "${NATIVE_BUS_INCLUDE}"
          write_kts_settings "plugins/native-bus/android"
          write_kts_settings "plugins/home-widgets/android"
          write_groovy_settings "plugins/app-management/android"
          write_groovy_settings "plugins/toast/android"

          ./apps/threshold-wear/gradlew -p plugins/alarm-manager/android :testDebugUnitTest -Pandroid.useAndroidX=true --no-daemon
          ./apps/threshold-wear/gradlew -p plugins/app-management/android testDebugUnitTest -Pandroid.useAndroidX=true --no-daemon
          ./apps/threshold-wear/gradlew -p plugins/theme-utils/android testDebugUnitTest -Pandroid.useAndroidX=true --no-daemon
          ./apps/threshold-wear/gradlew -p plugins/os-prefs/android testDebugUnitTest -Pandroid.useAndroidX=true --no-daemon
          ./apps/threshold-wear/gradlew -p plugins/predictive-back/android testDebugUnitTest -Pandroid.useAndroidX=true --no-daemon
          ./apps/threshold-wear/gradlew -p plugins/wear-sync/android :testDebugUnitTest -Pandroid.useAndroidX=true --no-daemon
          ./apps/threshold-wear/gradlew -p plugins/toast/android testDebugUnitTest -Pandroid.useAndroidX=true --no-daemon
          ./apps/threshold-wear/gradlew -p plugins/native-bus/android :testDebugUnitTest -Pandroid.useAndroidX=true --no-daemon
          ./apps/threshold-wear/gradlew -p plugins/home-widgets/android testDebugUnitTest -Pandroid.useAndroidX=true --no-daemon

      - name: Upload Kotlin Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kotlin-plugin-test-results
          path: plugins/**/android/build/test-results/**/*.xml

      - name: Publish Plugin Test Results
        if: always() && github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Threshold Plugin Tests
          files: plugins/**/android/build/test-results/**/*.xml
